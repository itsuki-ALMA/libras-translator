<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tradutor de Libras</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <header>
            <h1>Tradutor de Libras</h1>
            <p>Tradução em Tempo Real</p>
        </header>

        <main>
            <div class="card status-card">
                <div class="detection-info">
                    <div class="letra-container">
                        <span class="label">Letra Detectada</span>
                        <h2 id="letra">-</h2>
                    </div>
                    <div class="confianca-container">
                        <span class="label">Confiança</span>
                        <div class="progress-bar">
                            <div class="progress confianca" id="confianca-barra"></div>
                        </div>
                        <span id="confianca-texto">0%</span>
                    </div>
                </div>
                <div class="tempo-container">
                    <span class="label">Tempo para confirmar</span>
                    <div class="progress-bar">
                        <div class="progress tempo" id="tempo-barra"></div>
                    </div>
                    <span id="tempo-texto">0.0s</span>
                </div>
            </div>

            <div class="card text-card">
                <span class="label">Texto Atual</span>
                <div class="texto-display" id="texto-atual">
                    ...
                </div>
            </div>

            <div class="card message-card">
                <span class="label">Última Mensagem Enviada</span>
                <div class="mensagem-display" id="mensagem-enviada">
                    Nenhuma mensagem enviada ainda.
                </div>
            </div>
        </main>
    </div>

    <script>
        const TEMPO_CONFIRMACAO = 5;

        async function fetchStatus() {
            try {
                const response = await fetch('/status');
                const data = await response.json();

                document.getElementById('letra').innerText = data.letra;

                const confiancaPct = Math.round(data.confianca * 100);
                document.getElementById('confianca-barra').style.width = `${confiancaPct}%`;
                document.getElementById('confianca-texto').innerText = `${confiancaPct}%`;

                const tempoRestante = Math.max(0, data.restante);
                const tempoPct = (tempoRestante / TEMPO_CONFIRMACAO) * 100;
                document.getElementById('tempo-barra').style.width = `${tempoPct}%`;
                document.getElementById('tempo-texto').innerText = `${tempoRestante.toFixed(1)}s`;

                document.getElementById('texto-atual').innerText = data.texto || '...';
                document.getElementById('mensagem-enviada').innerText = data.mensagem || 'Nenhuma mensagem enviada ainda.';

            } catch (error) {
                console.error("Erro ao buscar status:", error);
            }
        }

        setInterval(fetchStatus, 200);
    </script>
</body>

</html>
